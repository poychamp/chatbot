name: chatbot

services:
  django:
    build:
      context: .
      dockerfile: docker/${DJANGO_ENV:-local}/Dockerfile
    env_file: .env
    ports:
      - "${DOCKER_HOST_PORT:-8000}:8000"
      - "${VITE_DEV_SERVER_PORT:-5173}:${VITE_DEV_SERVER_PORT:-5173}"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
